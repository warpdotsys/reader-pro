name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build (assemble)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon clean compileKotlin bootJar -x test
          else
            # fallback if wrapper missing
            gradle --no-daemon clean compileKotlin bootJar -x test
          fi

      - name: Upload boot jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reader-pro-bootjar
          path: build/libs/*.jar
          if-no-files-found: warn
