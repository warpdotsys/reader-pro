# Deploy like the original reader-pro fat jar:
#   - host port 8080 → container 8080
#   - persistent workDir at /data (storage + logs)
#   - Web UI at http://localhost:8080/  (same as jar)
#   - API at http://localhost:8080/reader3/
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f

services:
  reader-pro:
    build: .
    image: reader-pro:3.2.14
    container_name: reader-pro
    ports:
      - "${READER_PORT:-8080}:8080"
    volumes:
      # entire workDir (storage/data, storage/assets, logs) — same layout as jar cwd
      - ${READER_DATA:-./data}:/data
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -Dfile.encoding=UTF-8}
      READER_APP_WORKDIR: /data
      READER_SERVER_PORT: "8080"
      # Optional — same keys as application.yml / original jar
      READER_APP_SECURE: ${READER_APP_SECURE:-false}
      READER_APP_SECUREKEY: ${READER_APP_SECUREKEY:-}
      READER_APP_INVITECODE: ${READER_APP_INVITECODE:-}
      READER_APP_DEBUGLOG: ${READER_APP_DEBUGLOG:-false}
      READER_APP_USERLIMIT: ${READER_APP_USERLIMIT:-15}
      READER_APP_MONGOURI: ${READER_APP_MONGOURI:-}
      READER_APP_MONGODBNAME: ${READER_APP_MONGODBNAME:-reader}
      READER_APP_AUTOBACKUPUSERDATA: ${READER_APP_AUTOBACKUPUSERDATA:-false}
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

# Optional Mongo for backupToMongodb (compose profile: mongo)
  mongo:
    image: mongo:6
    profiles: ["mongo"]
    volumes:
      - reader-mongo:/data/db
    restart: unless-stopped

volumes:
  reader-mongo:
